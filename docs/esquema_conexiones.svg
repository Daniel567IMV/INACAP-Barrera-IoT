<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="720" fill="#F8F9FA"/>
  <rect x="0" y="0" width="1200" height="68" fill="#1D1D1B"/>
  <rect x="0" y="64" width="1200" height="4" fill="#E30613"/>
  <text x="36" y="42" fill="#FFFFFF" font-size="24" font-weight="bold">Esquema de Conexiones Hardware — Estacionamiento Inteligente INACAP (ES3 · TI3042)</text>

  <!-- ESP32 Center -->
  <rect x="440" y="130" width="320" height="470" rx="14" fill="#212529" stroke="#495057" stroke-width="3"/>
  <rect x="520" y="146" width="160" height="58" rx="6" fill="#ADB5BD"/>
  <text x="600" y="180" text-anchor="middle" fill="#212529" font-size="14" font-weight="bold">ESP-WROOM-32</text>
  <text x="600" y="232" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold">DOIT ESP32 DEVKIT V1</text>
  <text x="600" y="254" text-anchor="middle" fill="#CED4DA" font-size="12">Bluetooth Clásico SPP + Wi-Fi 2.4GHz + NVS Flash</text>

  <!-- Left Pins on ESP32 -->
  <rect x="440" y="280" width="110" height="30" rx="4" fill="#E30613"/><text x="495" y="300" text-anchor="middle" fill="#FFF" font-size="13" font-weight="bold">VIN (5 V)</text>
  <rect x="440" y="325" width="110" height="30" rx="4" fill="#343A40"/><text x="495" y="345" text-anchor="middle" fill="#FFF" font-size="13" font-weight="bold">GND</text>
  <rect x="440" y="385" width="110" height="30" rx="4" fill="#0D6EFD"/><text x="495" y="405" text-anchor="middle" fill="#FFF" font-size="13" font-weight="bold">GPIO 5</text>
  <rect x="440" y="430" width="110" height="30" rx="4" fill="#198754"/><text x="495" y="450" text-anchor="middle" fill="#FFF" font-size="13" font-weight="bold">GPIO 18</text>

  <!-- Right Pins on ESP32 -->
  <rect x="650" y="280" width="110" height="30" rx="4" fill="#FD7E14"/><text x="705" y="300" text-anchor="middle" fill="#FFF" font-size="13" font-weight="bold">GPIO 15 (PWM)</text>
  <rect x="650" y="370" width="110" height="30" rx="4" fill="#6F42C1"/><text x="705" y="390" text-anchor="middle" fill="#FFF" font-size="13" font-weight="bold">GPIO 21 (SDA)</text>
  <rect x="650" y="415" width="110" height="30" rx="4" fill="#0DCAF0"/><text x="705" y="435" text-anchor="middle" fill="#111" font-size="13" font-weight="bold">GPIO 22 (SCL)</text>
  <rect x="650" y="480" width="110" height="30" rx="4" fill="#343A40"/><text x="705" y="500" text-anchor="middle" fill="#FFF" font-size="13" font-weight="bold">GND Común</text>

  <!-- USB -->
  <rect x="560" y="575" width="80" height="25" rx="4" fill="#6C757D"/>
  <text x="600" y="592" text-anchor="middle" fill="#FFF" font-size="12" font-weight="bold">USB 5V</text>

  <!-- HC-SR04 Left -->
  <rect x="45" y="220" width="270" height="250" rx="12" fill="#FFFFFF" stroke="#0D6EFD" stroke-width="3"/>
  <rect x="45" y="220" width="270" height="42" rx="10" fill="#0D6EFD"/>
  <text x="180" y="247" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">Sensor Ultrasónico HC-SR04</text>
  <text x="180" y="286" text-anchor="middle" fill="#212529" font-size="13">VCC: 5V · TRIG: GPIO 5 · ECHO: GPIO 18</text>
  <text x="180" y="310" text-anchor="middle" fill="#495057" font-size="12">(Divisor resistivo 1 kΩ / 2 kΩ en ECHO → 3.3 V)</text>
  <circle cx="120" cy="375" r="34" fill="#DEE2E6" stroke="#495057" stroke-width="3"/>
  <circle cx="240" cy="375" r="34" fill="#DEE2E6" stroke="#495057" stroke-width="3"/>
  <text x="180" y="445" text-anchor="middle" fill="#212529" font-size="12" font-weight="bold">Umbral AUTO: &lt; 10 cm = OCUPADO</text>

  <!-- SG90 Top Right -->
  <rect x="885" y="130" width="270" height="190" rx="12" fill="#FFFFFF" stroke="#FD7E14" stroke-width="3"/>
  <rect x="885" y="130" width="270" height="42" rx="10" fill="#FD7E14"/>
  <text x="1020" y="157" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">Servomotor SG90 (Barrera)</text>
  <text x="1020" y="205" text-anchor="middle" fill="#212529" font-size="13">Señal PWM (50 Hz): GPIO 15</text>
  <text x="1020" y="232" text-anchor="middle" fill="#212529" font-size="13">Rojo: 5V · Café/Negro: GND</text>
  <text x="1020" y="268" text-anchor="middle" fill="#E30613" font-size="13" font-weight="bold">0° = Cerrada (Estado Seguro)</text>
  <text x="1020" y="292" text-anchor="middle" fill="#198754" font-size="13" font-weight="bold">90° = Abierta (Paso Vehicular)</text>

  <!-- LCD 1602 I2C Bottom Right -->
  <rect x="885" y="360" width="270" height="220" rx="12" fill="#FFFFFF" stroke="#6F42C1" stroke-width="3"/>
  <rect x="885" y="360" width="270" height="42" rx="10" fill="#6F42C1"/>
  <text x="1020" y="387" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">Display LCD 1602 I2C (0x27)</text>
  <rect x="910" y="420" width="220" height="58" rx="6" fill="#0B3D2E" stroke="#198754" stroke-width="2"/>
  <text x="1020" y="445" text-anchor="middle" fill="#7CFFB2" font-family="Consolas, monospace" font-size="15">L:11/12 D: 24cm</text>
  <text x="1020" y="467" text-anchor="middle" fill="#7CFFB2" font-family="Consolas, monospace" font-size="15">LIBRE    90G AUT</text>
  <text x="1020" y="510" text-anchor="middle" fill="#212529" font-size="13">SDA: GPIO 21 · SCL: GPIO 22</text>
  <text x="1020" y="535" text-anchor="middle" fill="#212529" font-size="13">VCC: 5V · GND: GND Común</text>

  <!-- Wires Left -->
  <polyline points="315,295 440,295" fill="none" stroke="#E30613" stroke-width="4"/>
  <polyline points="315,340 440,340" fill="none" stroke="#343A40" stroke-width="4"/>
  <polyline points="315,400 440,400" fill="none" stroke="#0D6EFD" stroke-width="4"/>
  <polyline points="315,445 440,445" fill="none" stroke="#198754" stroke-width="4"/>

  <!-- Wires Right -->
  <polyline points="760,295 820,295 820,205 885,205" fill="none" stroke="#FD7E14" stroke-width="4"/>
  <polyline points="760,385 885,435" fill="none" stroke="#6F42C1" stroke-width="4"/>
  <polyline points="760,430 885,465" fill="none" stroke="#0DCAF0" stroke-width="4"/>
  <polyline points="760,495 885,535" fill="none" stroke="#343A40" stroke-width="4"/>
  <polyline points="760,495 845,495 845,232 885,232" fill="none" stroke="#343A40" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Footer Note -->
  <rect x="45" y="630" width="1110" height="58" rx="10" fill="#E9ECEF" stroke="#CED4DA" stroke-width="1.5"/>
  <text x="600" y="655" text-anchor="middle" fill="#212529" font-size="13" font-weight="bold">Alimentación: Fuente 5 V común (USB / Powerbank / Fuente regulada) + GND compartido entre ESP32, HC-SR04, SG90 y LCD I2C 0x27</text>
  <text x="600" y="675" text-anchor="middle" fill="#495057" font-size="12">Lógica de Entrada: El Display LCD muestra plazas libres/total en el acceso y el ESP32 conserva las lecturas offline en memoria flash NVS (sin SD)</text>
</svg>
